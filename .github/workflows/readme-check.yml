name: README companion change

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  readme-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Require README alongside application changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          def needs_readme(path):
              return (
                  path.startswith(("src/", "supabase/", "scripts/", ".github/workflows/"))
                  or path in {
                      "package.json", "package-lock.json", "npm-shrinkwrap.json",
                      "yarn.lock", "pnpm-lock.yaml", "bun.lock", "bun.lockb",
                      "index.html", "build.mjs", ".env.example", "AGENTS.md",
                      "CLOUD_SYNC_SETUP.md", ".nvmrc", ".node-version", ".npmrc",
                      "Dockerfile", "Procfile",
                  }
                  or ("/" not in path and path.endswith((".js", ".jsx", ".ts", ".tsx", ".css", ".html")))
                  or ("/" not in path and path.startswith(("vite.config.", "vercel.", "tsconfig")))
              )

          paths = set()
          readme_updated = False
          for page in range(1, 32):
              url = (
                  f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}"
                  f"/pulls/{os.environ['GH_PR_NUMBER']}/files?per_page=100&page={page}"
              )
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  files = json.load(response)
              if not isinstance(files, list):
                  raise SystemExit("Could not read the PR file list.")
              for file in files:
                  if file["filename"] == "README.md":
                      if file.get("status") == "removed":
                          raise SystemExit("Keep README.md and update it for the final behavior.")
                      readme_updated = True
                  paths.add(file["filename"])
                  if file.get("previous_filename"):
                      paths.add(file["previous_filename"])
              if len(files) < 100:
                  break
          else:
              raise SystemExit("PR is too large to verify the README companion change safely.")

          affected = sorted(path for path in paths if needs_readme(path))
          if "README.md" in paths and not readme_updated:
              raise SystemExit("Keep the project handoff at README.md.")
          if affected and not readme_updated:
              raise SystemExit(
                  "Update README.md in this PR so a fresh chat has current context. "
                  "Application/configuration files changed: " + ", ".join(affected[:12])
              )
          print("README companion check passed. Review documentation for accuracy.")
